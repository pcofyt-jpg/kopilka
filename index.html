<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка: учимся зарабатывать</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1B2559">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Копилка">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&subset=cyrillic&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5FF;--card:#fff;--ink:#1B2559;--mut:#6A74A8;--line:#DDE4FA;--coin:#FFC53D;--spend:#FF7A5C;--save:#2EBD8E;--give:#7B6CF6;--btn:#1B2559;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1330;--card:#1A2050;--ink:#EEF1FF;--mut:#98A2D8;--line:#2B3472;--btn:#FFC53D;--btnt:#1B2559}}
:root[data-theme="dark"]{--bg:#0F1330;--card:#1A2050;--ink:#EEF1FF;--mut:#98A2D8;--line:#2B3472;--btn:#FFC53D;--btnt:#1B2559}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;font-weight:900;margin:0}
h2{font-size:18px;font-weight:900;margin:24px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--btn);color:var(--btnt)}
button:focus-visible,input:focus-visible{outline:3px solid var(--give);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.sm{padding:9px 12px;font-size:14px;min-height:40px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.tabs button.on{background:var(--coin);color:#1B2559;border-color:var(--coin)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.total{font-size:46px;font-weight:900;line-height:1}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--coin);margin-right:.2em;vertical-align:-.05em}
.bar{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--line);margin:14px 0 10px}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jar b{display:block;font-size:19px;font-weight:900}
.jar span{font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:2px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1}
.row small{display:block;color:var(--mut);font-weight:600}
.pay{font-weight:900;white-space:nowrap}
.wait{color:var(--mut);font-weight:800;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;min-height:48px;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.msg{margin-top:8px;font-weight:800}
.ok{color:var(--save)}.no{color:var(--spend)}
input,select{font:inherit;font-weight:700;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.form{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-top:10px}
.hist{font-size:14px;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:transparent;color:var(--mut);padding:4px 2px;font-size:12px;border-radius:10px;line-height:1.2}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--ink);background:var(--bg)}
@keyframes up{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-130px);opacity:0}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}
.fxp{position:fixed;left:50%;top:45%;font-size:40px;font-weight:900;color:var(--coin);animation:up 1.6s ease-out forwards;pointer-events:none;z-index:20}
.cf{position:fixed;top:-10px;width:10px;height:14px;animation:fall 2s linear forwards;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.cf,.fxp{animation:none;opacity:0}}
.snack{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;max-width:496px;margin:0 auto;background:var(--ink);color:var(--card);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800}
@keyframes pp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}22%{transform:translate(-50%,-50%) scale(1.18);opacity:1}65%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.cele{position:fixed;left:50%;top:38%;z-index:21;text-align:center;pointer-events:none;animation:pp 2.2s ease-out forwards}
.cele .ce{font-size:84px;line-height:1.1}
.cele .ct{display:inline-block;font-weight:900;font-size:22px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 14px;margin-top:6px}
.cf.coin{background:none!important;width:auto;height:auto;font-style:normal;font-size:24px}
@media (prefers-reduced-motion:reduce){.cele{animation:none;opacity:0}}
@media print{button,.tabs{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const SPLIT={save:.5,spend:.3,give:.2};
const JARS=[["save","Копить","--save"],["spend","Тратить","--spend"],["give","Дарить","--give"]];
const LESSONS=[
{id:"l1",v:1,t:"Доля от суммы",r:20,q:"Ты получил 100 ₽ и отложил 20 ₽. Какую часть ты отложил?",o:["Одну пятую","Половину","Одну десятую"],a:0,tip:"20 из 100 — это 1/5."},
{id:"l2",v:1,t:"Нужно или хочется",r:20,q:"Что из этого «нужно», а не «хочется»?",o:["Тёплая куртка зимой","Третья игровая приставка","Набор наклеек"],a:0,tip:"Сначала покупаем нужное."},
{id:"l3",v:1,t:"Копим на мечту",r:25,q:"Откладываешь по 50 ₽ в неделю. Сколько за 4 недели?",o:["150 ₽","200 ₽","250 ₽"],a:1,tip:"50 × 4 = 200 ₽."},
{id:"g1",v:1,t:"Игра: нужно или хочется",r:30,g:[["Хлеб",0],["Новая игрушка",1],["Зубная паста",0],["Конфеты",1],["Зимние ботинки",0]]},
{id:"l6",v:1,t:"Монеты и сдача",r:15,q:"Игрушка стоит 70 ₽, ты дал 100 ₽. Сколько сдачи?",o:["20 ₽","30 ₽","40 ₽"],a:1,tip:"100 − 70 = 30 ₽."},
{id:"l7",v:1,t:"Откуда деньги",r:15,q:"Откуда у семьи деньги на покупки?",o:["Из банкомата без причины","Родители зарабатывают их трудом","Появляются сами"],a:1,tip:"Деньги — это результат труда."},
{id:"l4",v:2,t:"Сравниваем цены",r:25,q:"Зачем сравнивать цены в разных магазинах?",o:["Чтобы дольше ходить","Чтобы купить то же дешевле","Незачем"],a:1,tip:"Разница остаётся у тебя."},
{id:"l5",v:2,t:"Подождать до завтра",r:30,q:"Очень хочется дорогую игрушку прямо сейчас. Что умнее?",o:["Купить сразу","Подождать пару дней","Занять денег у друга"],a:1,tip:"Если желание не прошло — покупка осознанная."},
{id:"l8",v:2,t:"Что такое бюджет",r:25,q:"Что такое бюджет?",o:["План: сколько получаем и тратим","Список игрушек","Название банка"],a:0,tip:"Бюджет помогает не остаться без денег."},
{id:"l9",v:2,t:"Скидки",r:25,q:"Игрушка стоила 200 ₽, скидка 10%. Сколько заплатишь?",o:["180 ₽","190 ₽","100 ₽"],a:0,tip:"10% от 200 — это 20 ₽."},
{id:"l10",v:2,t:"Бонус",r:30,q:"Вклад в банке приносит 5% в год. Было 100 ₽. Сколько станет через год?",o:["105 ₽","110 ₽","150 ₽"],a:0,tip:"5% от 100 — это 5 ₽."},
{id:"l11",v:2,t:"Реклама",r:25,q:"Зачем нужна реклама?",o:["Чтобы убедить нас купить","Чтобы мы стали умнее","Чтобы цены снижались"],a:0,tip:"Реклама хочет продать, а решаем мы."},
{id:"l12",v:2,t:"Зачем «Дарить»",r:25,q:"Зачем нужна копилка «Дарить»?",o:["Помогать другим и радовать близких","Тратить на себя","Незачем"],a:0,tip:"Делиться — тоже часть финансовой грамотности."},
{id:"l13",v:3,t:"Долг",r:30,q:"Друг просит 100 ₽ в долг. Что важно?",o:["Договориться, когда вернёт","Забыть об этих деньгах","Дать вдвое больше"],a:0,tip:"Долг нужно возвращать вовремя."},
{id:"l14",v:3,t:"Большая покупка",r:30,q:"Зачем копить на дорогую вещь?",o:["Чтобы купить то, что сразу не по карману","Копить бессмысленно","Чтобы деньги испортились"],a:0,tip:"Терпение даёт большие покупки."},
{id:"l15",v:3,t:"Мошенники",r:40,q:"Незнакомец пишет, что ты выиграл приз, и просит данные карты. Что делать?",o:["Рассказать родителям, ничего не сообщать","Отправить данные","Отправить половину"],a:0,tip:"Данные карты никому не говорим."},
{id:"l16",v:3,t:"Сложные проценты",r:40,q:"На счёте 100 ₽ и 10% в год. Сколько будет через 2 года, если проценты тоже растут?",o:["120 ₽","121 ₽","110 ₽"],a:1,tip:"100 → 110 → 121. Проценты на проценты."},
{id:"l17",v:3,t:"Цены растут",r:35,q:"Что значит «цены выросли»?",o:["Те же вещи стоят дороже","Вещи стали лучше","Деньги стали тяжелее"],a:0,tip:"Поэтому важно, чтобы накопления росли."},
{id:"l18",v:3,t:"Доходы и расходы",r:35,q:"Доход 500 ₽, расходы 350 ₽. Сколько осталось?",o:["100 ₽","150 ₽","850 ₽"],a:1,tip:"500 − 350 = 150 ₽."},
{id:"g2",v:3,t:"Игра: доход или расход",r:40,b:["Доход","Расход"],g:[["Карманные деньги",0],["Мороженое",1],["Подарок на день рождения",0],["Билет в кино",1],["Плата за помощь по дому",0]]},
{id:"l19",v:4,t:"План на месяц",r:30,q:"Карманных денег 600 ₽ в месяц. Что разумно сделать первым делом?",o:["Разделить на «копить», «тратить», «дарить»","Потратить всё в первый день","Ничего не планировать"],a:0,tip:"План помогает дотянуть до конца месяца."},
{id:"l20",v:4,t:"Откладываем пятую часть",r:30,q:"Ты откладываешь 20% от 500 ₽. Сколько это?",o:["50 ₽","100 ₽","200 ₽"],a:1,tip:"20% — это пятая часть: 500 ÷ 5 = 100 ₽."},
{id:"l21",v:4,t:"Цена за штуку",r:30,q:"Пачка из 10 тетрадей стоит 200 ₽, а одна тетрадь — 25 ₽. Что выгоднее?",o:["Пачка: 20 ₽ за тетрадь","Одна: 25 ₽ за тетрадь","Одинаково"],a:0,tip:"200 ÷ 10 = 20 ₽ за штуку, это дешевле."},
{id:"l22",v:4,t:"Скрытые расходы",r:35,q:"Ты хочешь телефон. Что ещё может понадобиться, кроме его цены?",o:["Чехол, зарядка, защитное стекло","Ничего, больше не нужно","Только упаковка"],a:0,tip:"Перед покупкой считай не только цену вещи."},
{id:"l23",v:4,t:"Когда покупать",r:35,q:"Когда зимняя куртка обычно стоит дешевле?",o:["В конце зимы, на распродаже","Перед первым снегом","Цена всегда одинаковая"],a:0,tip:"Сезонные вещи дешевеют, когда сезон заканчивается."},
{id:"l24",v:4,t:"Лишние покупки",r:35,q:"Что лучше всего помогает не купить лишнего в магазине?",o:["Список покупок и бюджет","Прийти голодным","Идти без плана"],a:0,tip:"Список защищает от импульсивных покупок."},
{id:"g3",v:4,t:"Игра: правда или миф",r:40,b:["Правда","Миф"],g:[["Скидка всегда выгодна",1],["Проценты увеличивают накопления",0],["Дорогое всегда лучше",1],["Список покупок помогает экономить",0],["Чем больше тратишь, тем богаче",1]]},
{id:"l25",v:5,t:"Что делает банк",r:35,q:"Что делает банк?",o:["Хранит деньги и выдаёт кредиты","Печатает деньги дома","Продаёт игрушки"],a:0,tip:"Банк берёт деньги на хранение и даёт их в долг."},
{id:"l26",v:5,t:"Вклад",r:35,q:"Ты положил 1000 ₽ на вклад под 10% в год. Сколько процентов получишь за год?",o:["10 ₽","100 ₽","1000 ₽"],a:1,tip:"10% от 1000 ₽ — это 100 ₽."},
{id:"l27",v:5,t:"Кредит",r:40,q:"Ты взял в долг 1000 ₽ под 10%. Сколько нужно вернуть?",o:["1000 ₽","1100 ₽","900 ₽"],a:1,tip:"Долг растёт: к 1000 ₽ добавляются 100 ₽ процентов."},

{id:"l29",v:5,t:"Курс валют",r:35,q:"Один доллар стоит 90 ₽. Сколько рублей за 2 доллара?",o:["90 ₽","180 ₽","45 ₽"],a:1,tip:"90 × 2 = 180 ₽. Курс может меняться."},
{id:"l30",v:5,t:"Деньги на вкладе",r:35,q:"Чем вклад лучше копилки под кроватью?",o:["Деньги растут за счёт процентов","Деньги становятся тяжелее","Банк их прячет"],a:0,tip:"Вклад приносит проценты, а копилка дома нет."},
{id:"l31",v:5,t:"Страховка",r:40,q:"Зачем нужна страховка?",o:["Получить помощь, если случится беда","Платить больше","Потерять деньги"],a:0,tip:"Небольшой платёж защищает от больших потерь."},
{id:"l32",v:6,t:"Откуда доход",r:40,q:"От чего зависит доход взрослого?",o:["От труда, знаний и спроса на работу","Только от везения","Только от возраста"],a:0,tip:"Знания и навыки помогают зарабатывать больше."},
{id:"l33",v:6,t:"Прибыль",r:40,q:"Ты купил лимоны за 100 ₽, а продал лимонад за 250 ₽. Какая прибыль?",o:["100 ₽","150 ₽","250 ₽"],a:1,tip:"Прибыль = выручка − расходы: 250 − 100 = 150 ₽."},
{id:"l34",v:6,t:"Цена товара",r:40,q:"Лимонад дорогой, и его не покупают. Что можно сделать?",o:["Пересмотреть цену или улучшить товар","Ругать покупателей","Ничего"],a:0,tip:"Цена должна нравиться и покупателю, и продавцу."},
{id:"l35",v:6,t:"Расходы магазина",r:40,q:"Что входит в расходы маленького магазина?",o:["Аренда, товар, зарплата","Только цена товара","Ничего"],a:0,tip:"У бизнеса много расходов, кроме закупки товара."},
{id:"l36",v:6,t:"Налоги",r:40,q:"Зачем нужны налоги?",o:["На школы, дороги и больницы","Чтобы банки богатели","Просто так"],a:0,tip:"Налоги идут на то, чем пользуются все."},
{id:"l37",v:6,t:"Честность",r:45,q:"Продавец по ошибке дал тебе лишние 100 ₽ сдачи. Как поступить?",o:["Вернуть лишнее","Промолчать","Спрятать"],a:0,tip:"Честность — основа доверия в делах с деньгами."},
{id:"l38",v:7,t:"Инфляция и вклад",r:45,q:"Цены выросли на 10%, а вклад принёс 5%. Что с покупательной способностью денег?",o:["Снизилась","Выросла","Не изменилась"],a:0,tip:"На те же деньги можно купить меньше."},
{id:"l39",v:7,t:"Риск и доход",r:45,q:"Чем выше возможный доход от вложения, тем…",o:["…выше риск потерять","…меньше риск","…риска нет"],a:0,tip:"Обещание большого дохода всегда связано с риском."},
{id:"l40",v:7,t:"Разные корзины",r:45,q:"Что значит «не клади все яйца в одну корзину»?",o:["Распределяй накопления, а не вкладывай всё в одно","Не храни яйца дома","Покупай только одно"],a:0,tip:"Если одна идея не сработает, остальные защитят."},

{id:"l42",v:7,t:"Обещания лёгких денег",r:50,q:"Тебе обещают быстро удвоить деньги без риска. Что это?",o:["Скорее всего обман","Отличная возможность","Обычный вклад"],a:0,tip:"Лёгких денег без риска не бывает."},
{id:"l43",v:7,t:"Большая цель",r:50,q:"Нужно накопить 6000 ₽ на велосипед за 6 месяцев. Как?",o:["Откладывать по 1000 ₽ в месяц","Ждать, пока деньги появятся","Взять в долг"],a:0,tip:"Цель, делённая на шаги, достижима."},
{id:"g4",v:7,t:"Игра: безопасно или рискованно",r:50,b:["Безопасно","Рискованно"],g:[["Положить деньги на вклад",0],["Отдать код карты незнакомцу",1],["Вложить все деньги в одну идею",1],["Откладывать понемногу каждую неделю",0],["Дать деньги в долг без договорённости",1]]}];

const STORIES=[
{id:"st1",v:1,t:"Mia's Birthday Money",r:25,p:[["🎂🎁","Mia","Wow! Grandma gave me 100 coins for my birthday!","Ого! Бабушка подарила мне 100 монет на день рождения!"],["🛍️🧸","Max","Let's spend it all on toys today!","Давай потратим всё на игрушки сегодня!"],["🐷🪙","Mia","No. I will split it: 50 to save, 30 to spend, 20 to give.","Нет. Я разделю: 50 копить, 30 тратить, 20 подарить."],["📅🚲","Leo","Smart! Saving little by little can buy a big dream.","Умно! Откладывая понемногу, можно купить большую мечту."],["🌟🐷","Mia","After one month, my piggy bank is heavier!","Через месяц моя копилка стала тяжелее!"]],k:[["save","копить"],["spend","тратить"],["give","дарить"]],q:[["How did Mia split her 100 coins?",["50 save, 30 spend, 20 give","All to spend","All to save"],0],["What did Max want to do?",["Spend everything on toys","Save for a year","Give all away"],0],["What did Leo say about saving?",["Little by little can buy a big dream","Saving is useless","Never save"],0]]},
{id:"st2",v:1,t:"Needs and Wants",r:25,p:[["🏪🥖","Mia","Mom gave us a list: bread, milk and notebooks.","Мама дала список: хлеб, молоко и тетради."],["🎮✨","Max","Look! A new game! I want it so much!","Смотри! Новая игра! Я так её хочу!"],["🤔📝","Leo","Is it a need or a want? Needs come first.","Это нужное или хочется? Сначала нужное."],["🥖🥛📓","Mia","Bread, milk, notebooks: needs. A game is a want.","Хлеб, молоко, тетради: нужное. Игра — хочется."],["🛒😊","Max","OK! Needs first. The game later, if I have money left.","Ладно! Сначала нужное. Игру потом, если останутся деньги."]],k:[["need","нужное"],["want","хочется"],["list","список"]],q:[["What was on the list?",["Bread, milk and notebooks","Games and sweets","Only toys"],0],["What comes first?",["Needs","Wants","Nothing"],0],["When can Max buy the game?",["Later, if money is left","Never","Right now"],0]]},
{id:"st3",v:1,t:"Counting Change",r:25,p:[["🏪🍎","Max","An apple costs 30 coins. I have 50.","Яблоко стоит 30 монет. У меня 50."],["🧮","Mia","Easy! 50 minus 30 is 20. You get 20 back.","Легко! 50 минус 30 — 20. Тебе вернут 20."],["💰🍎","Seller","Here is your apple and 20 coins change.","Вот ваше яблоко и сдача 20 монет."],["✅🤝","Leo","Always check your change. Everyone can make a mistake.","Всегда проверяй сдачу. Все могут ошибиться."],["😊🍎","Max","I checked it. It was right!","Я проверил. Всё верно!"]],k:[["change","сдача"],["price","цена"],["cost","стоить"]],q:[["How much does the apple cost?",["30 coins","50 coins","20 coins"],0],["How much change did Max get?",["20 coins","30 coins","50 coins"],0],["What should you always do?",["Check your change","Run away","Ignore the seller"],0]]},
{id:"st4",v:1,t:"Where Does Money Come From?",r:25,p:[["👨‍🔧🏠","Mia","Dad goes to work every day.","Папа каждый день ходит на работу."],["💵","Max","And he gets money for his work?","И он получает деньги за работу?"],["🧑‍🏫📚","Leo","Yes! People earn money by working and using their skills.","Да! Люди зарабатывают деньги трудом и умениями."],["🧹🍽️","Mia","We can earn too! We help at home and get paid.","Мы тоже можем! Помогаем дома и получаем плату."],["🌱💪","Max","So money is not magic. It is the result of work!","Значит, деньги — не магия. Это результат труда!"]],k:[["earn","зарабатывать"],["work","работа"],["skill","умение"]],q:[["How do people earn money?",["By working","By magic","By sleeping"],0],["How can kids earn money?",["By helping at home","Never","By shouting"],0],["Money is the result of…",["work","magic","luck only"],0]]},
{id:"st5",v:1,t:"The Piggy Bank Rule",r:25,p:[["🐷❓","Mia","Why do I put coins in my piggy bank every week?","Почему я каждую неделю кладу монеты в копилку?"],["🏁🚲","Leo","To reach a goal, like a new bike.","Чтобы достичь цели, например нового велосипеда."],["📈🪙","Leo","A bank can add extra money. It is called interest.","Банк может добавить деньги сверху. Это проценты."],["⏳🐷","Mia","So patience helps my money grow!","Значит, терпение помогает деньгам расти!"],["🎉🚲","Max","I will start saving for a bike too!","Я тоже начну копить на велосипед!"]],k:[["goal","цель"],["interest","проценты"],["patience","терпение"]],q:[["Why does Mia save every week?",["To reach a goal","To lose coins","To be bored"],0],["What is interest?",["Extra money added by a bank","A toy","A shop"],0],["What helps money grow?",["Patience","Rushing","Spending all"],0]]},
{id:"st6",v:2,t:"Compare Prices",r:30,p:[["🏬🏬","Mia","Two shops sell the same pencils. Shop A: 40 coins. Shop B: 30.","Два магазина продают одинаковые карандаши. А: 40 монет. Б: 30."],["🤨","Max","They are the same! Let's buy in the first one.","Они одинаковые! Купим в первом."],["🧠💡","Leo","Wait! Compare prices first. Why pay more for the same thing?","Подожди! Сначала сравни цены. Зачем платить больше за то же?"],["🧮✅","Mia","Shop B is cheaper. We save 10 coins.","В магазине Б дешевле. Мы экономим 10 монет."],["🎉","Max","Ten coins is a snack! I get it now.","Десять монет — это перекус! Теперь понял."]],k:[["compare","сравнивать"],["cheaper","дешевле"],["same","одинаковый"]],q:[["Which shop is cheaper?",["Shop B","Shop A","They are the same"],0],["How much do they save?",["10 coins","30 coins","40 coins"],0],["What should you do before buying?",["Compare prices","Buy fast","Ask nobody"],0]]},
{id:"st7",v:2,t:"Sale or Not?",r:30,p:[["🏷️","Max","SALE! Half price! I must buy it!","РАСПРОДАЖА! Полцены! Надо брать!"],["🧸❓","Leo","Do you need it, or do you just like the sale?","Тебе это нужно или тебе просто нравится скидка?"],["🤔","Max","Hmm... I already have three toys like this.","Хм... У меня уже три такие игрушки."],["💡","Mia","A sale is good only if you really need the thing.","Скидка хороша, только если вещь правда нужна."],["💰😊","Max","Then I keep my money. Saving is also winning!","Тогда я оставлю деньги. Сэкономить — тоже победа!"]],k:[["sale","распродажа"],["half price","полцены"],["need","нужно"]],q:[["What did Max think at first?",["Buy it because of the sale","Don't buy","Sell it"],0],["Why did Max change his mind?",["He already had three toys","It was ugly","It was heavy"],0],["When is a sale good?",["When you need the thing","Always","Never"],0]]},
{id:"st8",v:2,t:"Wait Two Days",r:30,p:[["🎧🛒","Mia","I want these headphones right now!","Я хочу эти наушники прямо сейчас!"],["⏰","Leo","Try the two-day rule. Wait two days, then decide.","Попробуй правило двух дней. Подожди два дня и реши."],["📅📅","Mia","After two days, I still want them. And I have enough money.","Через два дня я всё ещё хочу. И денег хватает."],["✅🎧","Leo","Then it is a smart choice, not a rush.","Тогда это разумный выбор, а не спешка."],["🙂","Mia","Waiting helped me to be sure!","Ожидание помогло мне убедиться!"]],k:[["rule","правило"],["decide","решать"],["rush","спешка"]],q:[["What is the rule?",["Wait two days","Buy at once","Ask a stranger"],0],["What happened after two days?",["She still wanted them","She forgot","She lost money"],0],["Waiting helps you to…",["be sure","spend more","hurry"],0]]},
{id:"st9",v:2,t:"Make a Budget",r:30,p:[["💵💵","Mia","I get 200 coins a month. Where will it go?","Я получаю 200 монет в месяц. Куда они пойдут?"],["📝","Leo","A budget is a plan: how much to save, spend and give.","Бюджет — это план: сколько копить, тратить и дарить."],["🐷💸🎁","Mia","100 to save, 60 to spend, 40 to give.","100 копить, 60 тратить, 40 подарить."],["📅","Max","And if I spend it all in one day?","А если я потрачу всё за один день?"],["😬","Leo","Then you wait until next month. A plan protects you.","Тогда ждёшь до следующего месяца. План защищает тебя."]],k:[["budget","бюджет"],["plan","план"],["month","месяц"]],q:[["What is a budget?",["A plan for money","A kind of toy","A shop"],0],["How much does Mia plan to save?",["100 coins","60 coins","40 coins"],0],["What if you spend it all in one day?",["You wait until next month","Money comes back","You get double"],0]]},
{id:"st10",v:2,t:"The Lemonade Stand",r:30,p:[["🍋🍋","Mia","I bought lemons for 100 coins.","Я купила лимоны за 100 монет."],["🥤🧊","Max","Let's make lemonade and sell it!","Давай сделаем лимонад и продадим!"],["🪙🪙🪙","Mia","We sold all the lemonade for 250 coins!","Мы продали весь лимонад за 250 монет!"],["🧮","Leo","Profit is money earned minus costs: 250 − 100 = 150.","Прибыль — это выручка минус расходы: 250 − 100 = 150."],["🎉","Max","So our profit is 150 coins!","Значит, наша прибыль 150 монет!"]],k:[["profit","прибыль"],["costs","расходы"],["sell","продавать"]],q:[["How much did the lemons cost?",["100 coins","250 coins","150 coins"],0],["How much did they sell the lemonade for?",["250 coins","100 coins","150 coins"],0],["What is the profit?",["150 coins","250 coins","100 coins"],0]]},
{id:"st11",v:3,t:"Interest Magic",r:35,p:[["🏦","Leo","Mia put 1000 coins in a bank for a year.","Мия положила 1000 монет в банк на год."],["📈","Mia","The bank pays 10 percent interest.","Банк платит 10 процентов."],["🧮","Leo","10% of 1000 is 100. So she gets 100 extra coins.","10% от 1000 — это 100. Она получает 100 монет сверху."],["💰","Max","Money that grows by itself? Cool!","Деньги растут сами? Круто!"],["⏳","Leo","Yes, but it needs time. Patience again!","Да, но нужно время. Опять терпение!"]],k:[["bank","банк"],["percent","процент"],["extra","дополнительный"]],q:[["How much did Mia put in the bank?",["1000 coins","100 coins","10 coins"],0],["How much extra will she get?",["100 coins","10 coins","1000 coins"],0],["What does interest need?",["Time","Luck","Noise"],0]]},
{id:"st12",v:3,t:"Safe Card",r:35,p:[["💳","Max","A message says: send me your card code and win a prize!","Сообщение: пришли код карты и выиграй приз!"],["🚫","Mia","Stop! Never share your PIN or codes.","Стоп! Никогда не сообщай ПИН и коды."],["👨‍👩‍👧","Leo","Tell a parent about it right away.","Сразу расскажи об этом родителям."],["🗑️","Max","I will delete the message.","Я удалю сообщение."],["🛡️","Mia","Safe habits protect your money!","Безопасные привычки защищают деньги!"]],k:[["PIN","ПИН-код"],["prize","приз"],["protect","защищать"]],q:[["What did the message ask for?",["The card code","A photo","A song"],0],["What should Max do?",["Tell a parent","Send the code","Reply fast"],0],["Can you share your PIN?",["No, never","Yes, with anyone","Only on Sundays"],0]]},
{id:"st13",v:3,t:"Honest Change",r:35,p:[["🏪","Max","The seller gave me 100 extra coins by mistake!","Продавец по ошибке дал мне лишние 100 монет!"],["🤫","Max","Nobody saw it. Should I keep it?","Никто не видел. Оставить?"],["🤝","Leo","Honesty is the base of trust with money.","Честность — основа доверия в делах с деньгами."],["↩️","Max","I will give it back.","Я верну их."],["😊","Seller","Thank you! You are an honest boy.","Спасибо! Ты честный мальчик."]],k:[["honest","честный"],["mistake","ошибка"],["trust","доверие"]],q:[["What was the mistake?",["Extra change","Wrong apple","A lost bag"],0],["What did Max do?",["Gave it back","Kept it","Hid it"],0],["Honesty builds…",["trust","fear","noise"],0]]},
{id:"st14",v:3,t:"Give and Share",r:35,p:[["🏥🧸","Mia","Our class collects toys for children in a hospital.","Наш класс собирает игрушки для детей в больнице."],["🎁","Max","I can use my Give coins!","Я могу использовать монеты из «Дарить»!"],["🛒🧸","Mia","I bought a small toy with 20 coins.","Я купила маленькую игрушку за 20 монет."],["😊","Leo","Giving makes others happy, and you too.","Дарить — радость для других и для тебя."],["🌍","Max","Sharing is also a part of money smarts.","Делиться — тоже часть финансовой грамотности."]],k:[["share","делиться"],["donate","жертвовать"],["happy","счастливый"]],q:[["Who collects the toys?",["Mia's class","The seller","Leo alone"],0],["Which coins can Max use?",["Give coins","Only Spend coins","Only Save coins"],0],["Giving makes people…",["happy","angry","bored"],0]]},
{id:"st15",v:3,t:"Dream Goal",r:35,p:[["🚲💭","Max","I want a bike. It costs 6000 coins.","Я хочу велосипед. Он стоит 6000 монет."],["📅","Leo","How many months do you have?","Сколько у тебя месяцев?"],["6️⃣","Max","Six months.","Шесть."],["🧮","Mia","6000 ÷ 6 = 1000. Save 1000 each month.","6000 ÷ 6 = 1000. Откладывай по 1000 в месяц."],["🎯","Leo","A big goal is easier in small steps.","Большая цель проще маленькими шагами."]],k:[["goal","цель"],["step","шаг"],["month","месяц"]],q:[["How much is the bike?",["6000 coins","1000 coins","600 coins"],0],["How much should Max save per month?",["1000 coins","600 coins","6000 coins"],0],["A big goal is easier…",["in small steps","at once","never"],0]]},
{id:"st16",v:4,t:"Plan the Month",r:40,p:[["📅💵","Mia","Grandpa gave me 300 coins for the month.","Дедушка дал мне 300 монет на месяц."],["📝","Leo","Make a plan first: save, spend, give.","Сначала составь план: копить, тратить, дарить."],["🐷","Mia","I will save 150, spend 100 and give 50.","Я отложу 150, потрачу 100 и подарю 50."],["🍦🛍️","Max","What if I want ice cream every day?","А если я захочу мороженое каждый день?"],["⚖️","Leo","Then count it in your spending part. A plan keeps you honest.","Тогда считай это в части трат. План делает тебя честным."]],k:[["plan","план"],["monthly","ежемесячный"],["honest","честный"]],q:[["How many coins did Mia get?",["300 coins","150 coins","100 coins"],0],["How much will she save?",["150 coins","100 coins","50 coins"],0],["Where should the ice cream money come from?",["The spending part","The saving part","Grandpa's pocket"],0]]},
{id:"st17",v:4,t:"Price Per Item",r:40,p:[["🖊️🖊️","Mia","A pack of 6 pens costs 90 coins. One pen costs 18 coins.","Пачка из 6 ручек стоит 90 монет. Одна ручка — 18."],["🧮","Leo","Divide: 90 ÷ 6 = 15. The pack is cheaper per pen.","Раздели: 90 ÷ 6 = 15. В пачке ручка дешевле."],["🤔","Max","But I need only one pen!","Но мне нужна только одна ручка!"],["💡","Leo","Then buy one. A low price is good only if you will use it.","Тогда купи одну. Низкая цена хороша, только если ты это используешь."],["✅","Mia","Compare the price per item, but think about what you need.","Сравнивай цену за штуку, но думай, что тебе нужно."]],k:[["pack","пачка"],["divide","делить"],["per item","за штуку"]],q:[["How much is one pen in the pack?",["15 coins","18 coins","90 coins"],0],["Which is cheaper per pen?",["The pack","One pen","They are equal"],0],["Why should Max buy only one?",["He needs only one","Packs are bad","One is always cheaper"],0]]},
{id:"st18",v:4,t:"Hidden Costs",r:40,p:[["📱","Max","This phone costs 10000 coins! I will buy it.","Этот телефон стоит 10000 монет! Куплю его."],["🔌🧤","Mia","Wait. Do you need a case and a charger too?","Подожди. Тебе нужны ещё чехол и зарядка?"],["🧾","Leo","Yes! Hidden costs are extra things you must pay for later.","Да! Скрытые расходы — это дополнительные вещи, за которые платишь потом."],["➕","Mia","Case 300, charger 500. Total is 10800.","Чехол 300, зарядка 500. Всего 10800."],["😮","Max","Thanks! Now I plan for the full price.","Спасибо! Теперь я планирую полную цену."]],k:[["hidden","скрытый"],["extra","дополнительный"],["total","итого"]],q:[["What is the phone's price?",["10000 coins","10800 coins","300 coins"],0],["What are hidden costs?",["Extra things you pay for later","Free gifts","A secret shop"],0],["What is the full price?",["10800 coins","10000 coins","10500 coins"],0]]},
{id:"st19",v:4,t:"The Shopping List",r:40,p:[["🏬🍫","Max","I came only for bread, but the candy looks so good!","Я пришёл только за хлебом, но конфеты выглядят так вкусно!"],["📝","Mia","Stores put sweets near the cash desk on purpose.","Магазины специально ставят сладости у кассы."],["🛒✅","Leo","A shopping list helps you buy only what you planned.","Список покупок помогает купить только то, что запланировал."],["🍞","Max","Bread. That is all on my list.","Хлеб. Это всё, что у меня в списке."],["😎","Mia","You beat the candy trap!","Ты обошёл конфетную ловушку!"]],k:[["list","список"],["trap","ловушка"],["planned","запланированный"]],q:[["What did Max come for?",["Bread","Candy","A toy"],0],["Why are sweets near the cash desk?",["On purpose, to sell more","By accident","They are free"],0],["What helps you buy only what you planned?",["A shopping list","Being hungry","Running"],0]]},
{id:"st20",v:4,t:"Season Prices",r:40,p:[["🧥❄️","Mia","A winter coat costs 2000 coins in November.","Зимняя куртка стоит 2000 монет в ноябре."],["🌸","Leo","In March the same coat is only 1200 coins.","В марте та же куртка всего 1200 монет."],["🧮","Mia","We save 800 coins if we wait!","Мы экономим 800 монет, если подождём!"],["🤔","Max","But then I will freeze this winter.","Но тогда я замёрзну этой зимой."],["🏷️","Leo","Buy what you need now. Buy for next year at the sale.","Нужное покупай сейчас. На следующий год — на распродаже."]],k:[["season","сезон"],["sale","распродажа"],["save","экономить"]],q:[["How much is the coat in March?",["1200 coins","2000 coins","800 coins"],0],["How much do they save?",["800 coins","1200 coins","2000 coins"],0],["When should you buy for next year?",["At the sale","At full price","Never"],0]]},
{id:"st21",v:5,t:"What Does a Bank Do?",r:45,p:[["🏦","Leo","A bank keeps people's money safe.","Банк хранит деньги людей в безопасности."],["🔒💵","Mia","So I don't need to hide coins under my bed?","Значит, мне не нужно прятать монеты под кроватью?"],["🤝","Leo","Right. The bank also lends money to other people.","Верно. Банк также даёт деньги в долг другим людям."],["📈","Leo","They pay back more. Part of it goes to you as interest.","Они возвращают больше. Часть идёт тебе в виде процентов."],["😊","Mia","So the bank pays me for keeping my money there!","Значит, банк платит мне за хранение денег!"]],k:[["bank","банк"],["lend","давать в долг"],["safe","безопасный"]],q:[["What does a bank keep?",["People's money","Toys","Bikes"],0],["What does a bank do with deposits?",["Lends them to others","Burns them","Hides them forever"],0],["Who pays interest to Mia?",["The bank","Max","Nobody"],0]]},
{id:"st22",v:5,t:"The Savings Account",r:45,p:[["🏦🐷","Mia","I put 500 coins in a savings account.","Я положила 500 монет на накопительный счёт."],["📅","Leo","It pays 8 percent a year.","Он платит 8 процентов в год."],["🧮","Mia","8% of 500 is 40 coins.","8% от 500 — это 40 монет."],["⏳","Leo","If you do not touch it, next year you have 540.","Если не трогать, на следующий год будет 540."],["🌱","Mia","Money that waits grows!","Деньги, которые ждут, растут!"]],k:[["account","счёт"],["yearly","в год"],["touch","трогать"]],q:[["How much did Mia put in?",["500 coins","40 coins","540 coins"],0],["How much interest after a year?",["40 coins","8 coins","500 coins"],0],["How much will she have if she waits?",["540 coins","500 coins","460 coins"],0]]},
{id:"st23",v:5,t:"Borrowing Money",r:45,p:[["🛍️💸","Max","I want a 1000-coin game but I have only 400.","Я хочу игру за 1000 монет, а у меня только 400."],["🤝","Mia","You can borrow 600 coins from Dad.","Ты можешь занять 600 монет у папы."],["📜","Leo","Make a deal: when and how will you pay back?","Договорись: когда и как вернёшь?"],["📅","Max","I will pay 100 coins every week for six weeks.","Я буду отдавать по 100 монет в неделю шесть недель."],["✅","Leo","A debt is a promise. Keep it!","Долг — это обещание. Выполняй его!"]],k:[["borrow","занимать"],["debt","долг"],["promise","обещание"]],q:[["How much did Max have?",["400 coins","600 coins","1000 coins"],0],["How much did he borrow?",["600 coins","400 coins","100 coins"],0],["A debt is like…",["a promise","a gift","a toy"],0]]},
{id:"st24",v:5,t:"Loan Interest",r:45,p:[["🏦💳","Leo","A bank lends 1000 coins at 10 percent for a year.","Банк даёт 1000 монет под 10 процентов на год."],["🧮","Mia","10% of 1000 is 100 coins.","10% от 1000 — это 100 монет."],["➕","Leo","So you must pay back 1100 coins.","Значит, нужно вернуть 1100 монет."],["🤔","Max","So borrowing costs money!","Значит, занимать — это стоит денег!"],["💡","Leo","Yes. Borrow only when you really need it.","Да. Занимай, только когда это действительно нужно."]],k:[["loan","кредит"],["pay back","вернуть"],["cost","стоить"]],q:[["How much did the bank lend?",["1000 coins","1100 coins","100 coins"],0],["How much must be paid back?",["1100 coins","1000 coins","900 coins"],0],["When should you borrow?",["Only when really needed","Always","Never think about it"],0]]},
{id:"st25",v:5,t:"Card Safety",r:45,p:[["💳","Mia","I got my first bank card!","Я получила свою первую банковскую карту!"],["🔢","Leo","The PIN is secret. Never tell it to anyone.","ПИН-код секретный. Никому его не говори."],["📱⚠️","Max","A stranger asked me for the code from a text message.","Незнакомец попросил у меня код из сообщения."],["🚫","Leo","Never share codes! Real banks never ask for them.","Никогда не сообщай коды! Настоящие банки их не просят."],["🛡️","Mia","I will tell my parents if something looks strange.","Я скажу родителям, если что-то выглядит странно."]],k:[["card","карта"],["secret","секретный"],["strange","странный"]],q:[["What is secret?",["The PIN","The card colour","The shop name"],0],["What do real banks never ask for?",["Codes from messages","Your name","Your age"],0],["What should Mia do if something is strange?",["Tell her parents","Ignore it","Reply fast"],0]]},
{id:"st26",v:6,t:"Skills Pay",r:50,p:[["🧑‍🏫📚","Leo","Different jobs need different skills.","Разные профессии требуют разных умений."],["🧑‍⚕️","Mia","A doctor studies for many years.","Врач учится много лет."],["🎨💻","Max","A designer learns drawing and computers.","Дизайнер учится рисовать и работать на компьютере."],["📈","Leo","Rare skills that many people need are often paid more.","Редкие умения, нужные многим, часто оплачиваются выше."],["🌟","Mia","So learning today helps me earn tomorrow!","Значит, учёба сегодня помогает зарабатывать завтра!"]],k:[["skill","умение"],["job","профессия"],["rare","редкий"]],q:[["What do different jobs need?",["Different skills","The same toy","Nothing"],0],["Who studies for many years?",["A doctor","A baby","A cat"],0],["Why is learning useful?",["It helps you earn later","It is boring","It costs coins only"],0]]},
{id:"st27",v:6,t:"Selling Cookies",r:50,p:[["🍪","Mia","I bake cookies. Ingredients cost 200 coins.","Я пеку печенье. Продукты стоят 200 монет."],["🏷️","Max","How many cookies do you get?","Сколько получится печенья?"],["4️⃣0️⃣","Mia","Forty. If I sell each for 10 coins, I get 400.","Сорок. Если продам каждое по 10 монет, получу 400."],["🧮","Leo","Profit is 400 − 200 = 200 coins.","Прибыль 400 − 200 = 200 монет."],["🎉","Mia","And my time and effort are worth something too!","А мои время и труд тоже чего-то стоят!"]],k:[["ingredients","продукты"],["price","цена"],["effort","усилия"]],q:[["How much did ingredients cost?",["200 coins","400 coins","10 coins"],0],["What is the profit?",["200 coins","400 coins","40 coins"],0],["What else is valuable?",["Her time and effort","Nothing","Only the oven"],0]]},
{id:"st28",v:6,t:"Fair Price",r:50,p:[["🛒","Max","I want to sell my old toys. For how much?","Я хочу продать старые игрушки. За сколько?"],["🔎","Leo","Check similar toys. What do other people ask?","Посмотри похожие игрушки. Сколько просят другие?"],["⚖️","Mia","If your price is too high, nobody buys.","Если цена слишком высокая, никто не купит."],["📉","Mia","If it is too low, you lose money.","Если слишком низкая, ты теряешь деньги."],["👍","Max","I will choose a fair price in the middle.","Я выберу справедливую цену посередине."]],k:[["fair","справедливый"],["similar","похожий"],["lose","терять"]],q:[["What should Max check first?",["Similar toys","The weather","His shoes"],0],["What if the price is too high?",["Nobody buys","Everybody buys","It is free"],0],["What price does Max choose?",["A fair one","The highest","The lowest"],0]]},
{id:"st29",v:6,t:"Taxes and Roads",r:50,p:[["🛣️","Max","Who builds the roads?","Кто строит дороги?"],["🏛️","Leo","The city, with money from taxes.","Город, на деньги от налогов."],["💼","Mia","People pay taxes from their salary and purchases.","Люди платят налоги с зарплаты и покупок."],["🏫🏥","Leo","Taxes also pay for schools and hospitals.","Налоги платят и за школы, и за больницы."],["🤝","Max","So taxes help everyone use things together.","Значит, налоги помогают всем пользоваться общими вещами."]],k:[["tax","налог"],["salary","зарплата"],["city","город"]],q:[["Who builds the roads?",["The city","Max","A bank card"],0],["Where does the money come from?",["Taxes","Candy","Luck"],0],["What else do taxes pay for?",["Schools and hospitals","Only toys","Nothing"],0]]},
{id:"st30",v:6,t:"The Honest Seller",r:50,p:[["🏪","Mia","The customer paid with a big bill.","Покупатель заплатил крупной купюрой."],["💰","Max","I gave him too much change. He didn't notice.","Я дал ему слишком много сдачи. Он не заметил."],["🤔","Leo","What should an honest seller do?","Что должен сделать честный продавец?"],["↩️","Max","Call him back and fix it.","Окликнуть его и исправить."],["🤝","Leo","Honest sellers keep customers for years.","Честные продавцы годами сохраняют покупателей."]],k:[["customer","покупатель"],["notice","замечать"],["fix","исправлять"]],q:[["What did Max do wrong?",["Gave too much change","Sold nothing","Closed the shop"],0],["What should an honest seller do?",["Fix the mistake","Hide it","Run away"],0],["Honest sellers keep…",["customers","secrets only","nothing"],0]]},
{id:"st31",v:7,t:"Prices Go Up",r:55,p:[["🍞","Leo","Ten years ago bread cost 20 coins. Today it costs 40.","Десять лет назад хлеб стоил 20 монет. Сегодня — 40."],["📈","Mia","Prices grow slowly. It is called inflation.","Цены медленно растут. Это называется инфляцией."],["🐷","Max","So 100 coins under a bed buys less every year?","То есть 100 монет под кроватью покупают с каждым годом меньше?"],["🏦","Leo","Yes. That is why savings should earn interest.","Да. Поэтому накопления должны приносить проценты."],["💡","Mia","Money must work, not sleep.","Деньги должны работать, а не спать."]],k:[["inflation","инфляция"],["grow","расти"],["earn","приносить доход"]],q:[["How much did bread cost ten years ago?",["20 coins","40 coins","10 coins"],0],["What is inflation?",["Prices going up","Prices going down","A kind of bread"],0],["Why should savings earn interest?",["To fight rising prices","To be heavy","To hide"],0]]},
{id:"st32",v:7,t:"Risk and Reward",r:55,p:[["🎢","Max","A friend says: give me your coins, I will return triple!","Друг говорит: отдай монеты, верну втрое!"],["🤨","Mia","High reward usually means high risk.","Большая награда обычно значит большой риск."],["⚖️","Leo","Ask: what if it fails? Can I lose everything?","Спроси: а если не получится? Я могу потерять всё?"],["🚫","Max","Then I will not risk my savings.","Тогда я не стану рисковать накоплениями."],["✅","Leo","Smart! Risk only what you can afford to lose.","Умно! Рискуй только тем, что не страшно потерять."]],k:[["risk","риск"],["reward","награда"],["afford","позволить себе"]],q:[["What did the friend promise?",["Triple the coins","Nothing","A toy"],0],["High reward usually means…",["high risk","no risk","free money"],0],["What should you risk?",["Only what you can afford to lose","All your savings","Your friend's money"],0]]},
{id:"st33",v:7,t:"Many Baskets",r:55,p:[["🧺🥚","Leo","A farmer carries all eggs in one basket.","Фермер несёт все яйца в одной корзине."],["💥","Max","He falls. All the eggs break!","Он падает. Все яйца разбиваются!"],["🧺🧺","Mia","Better to use several baskets.","Лучше использовать несколько корзин."],["💼","Leo","It is the same with money: do not put everything in one idea.","С деньгами так же: не вкладывай всё в одну идею."],["🙂","Max","I will split my savings.","Я разделю свои накопления."]],k:[["basket","корзина"],["break","разбиваться"],["split","делить"]],q:[["What happened to the eggs?",["They broke","They flew","They were sold"],0],["What is better?",["Several baskets","One basket","No baskets"],0],["What will Max do with savings?",["Split them","Spend all today","Hide them in one place only"],0]]},
{id:"st34",v:7,t:"What Is a Share?",r:55,p:[["🍕","Leo","Imagine a pizza company cut into 100 slices.","Представь пиццерию, разрезанную на 100 кусочков."],["🧩","Mia","Each slice is a share. Whoever has one owns a tiny part.","Каждый кусочек — акция. У кого она есть, тот владеет крошечной частью."],["📈","Leo","If the company does well, the share can grow in price.","Если компания работает хорошо, акция может вырасти в цене."],["📉","Max","And if it does badly?","А если плохо?"],["⚠️","Leo","Then the price can fall. Shares are risky.","Тогда цена может упасть. Акции рискованны."]],k:[["share","акция"],["owner","владелец"],["price","цена"]],q:[["What is a share?",["A tiny part of a company","A kind of pizza","A bank card"],0],["When can a share grow?",["When the company does well","Never","When it rains"],0],["Are shares risky?",["Yes, the price can fall","No, never","Only on Mondays"],0]]},
{id:"st35",v:7,t:"The Lazy Money Scam",r:55,p:[["📩","Max","I got a message: double your money in one day!","Я получил сообщение: удвой деньги за один день!"],["🚨","Mia","That is a red flag. Easy money does not exist.","Это тревожный знак. Лёгких денег не бывает."],["🔍","Leo","Check who sends it. Ask an adult.","Проверь, кто отправил. Спроси взрослого."],["🗑️","Max","I will delete it and block the sender.","Я удалю и заблокирую отправителя."],["🛡️","Leo","Careful kids keep their coins.","Осторожные дети сохраняют свои монеты."]],k:[["scam","мошенничество"],["red flag","тревожный знак"],["block","блокировать"]],q:[["What did the message promise?",["To double the money","A free pizza","A new friend"],0],["What is a red flag?",["A warning sign","A flag for sport","A good deal"],0],["What will Max do?",["Delete and block","Send money","Reply quickly"],0]]},
{id:"st36",v:8,t:"A Business Idea",r:60,p:[["💡","Mia","I have an idea: make bracelets for classmates.","У меня идея: делать браслеты для одноклассников."],["❓","Leo","Who needs them? Ask people first.","Кому они нужны? Сначала спроси людей."],["📋","Max","I asked 10 kids. Seven said yes!","Я спросил 10 детей. Семеро сказали да!"],["✅","Leo","Good. A business starts with a real need.","Хорошо. Бизнес начинается с настоящей потребности."],["🌟","Mia","Then I will start small.","Тогда я начну с малого."]],k:[["idea","идея"],["need","потребность"],["start","начинать"]],q:[["What is Mia's idea?",["Making bracelets","Selling cars","Opening a bank"],0],["How many kids said yes?",["Seven","Ten","Two"],0],["A business starts with…",["a real need","luck","a loud voice"],0]]},
{id:"st37",v:8,t:"Start Small",r:60,p:[["🧵","Mia","Beads and thread cost 150 coins.","Бусины и нитки стоят 150 монет."],["📦","Leo","Make 10 bracelets first, not 100.","Сначала сделай 10 браслетов, а не 100."],["🧮","Max","If I sell each for 30, I get 300.","Если продам каждый за 30, получу 300."],["📈","Leo","Profit is 150. Now you can buy more beads.","Прибыль 150. Теперь можно купить больше бусин."],["🔁","Mia","Reinvesting helps a business grow.","Реинвестирование помогает бизнесу расти."]],k:[["reinvest","вкладывать снова"],["thread","нитка"],["grow","расти"]],q:[["How much did materials cost?",["150 coins","300 coins","30 coins"],0],["What is the profit?",["150 coins","300 coins","450 coins"],0],["What does reinvesting do?",["Helps the business grow","Stops the business","Hides money"],0]]},
{id:"st38",v:8,t:"Know Your Customer",r:60,p:[["👧👦","Mia","Girls like pink bracelets. Boys like blue.","Девочки любят розовые браслеты. Мальчики — синие."],["🎨","Leo","Make what your customers like.","Делай то, что нравится покупателям."],["💬","Max","I will ask for feedback after each sale.","Я буду спрашивать отзыв после каждой продажи."],["📝","Mia","One kid wanted a name on the bracelet.","Одному ребёнку хотелось имя на браслете."],["⭐","Leo","Listening to customers makes better products.","Слушая покупателей, делаешь товар лучше."]],k:[["customer","покупатель"],["feedback","отзыв"],["product","товар"]],q:[["What should you make?",["What customers like","What you hate","Nothing"],0],["What is feedback?",["Opinions from customers","A kind of thread","A bank card"],0],["Listening to customers makes…",["better products","worse products","no change"],0]]},
{id:"st39",v:8,t:"Honest Advertising",r:60,p:[["📢","Mia","How can people know about my bracelets?","Как люди узнают о моих браслетах?"],["🖼️","Leo","Make a poster with a photo and a price.","Сделай плакат с фото и ценой."],["🚫","Max","Can I write 'the best in the world'?","Можно написать «лучшие в мире»?"],["✅","Leo","Only if it is true. Honest ads build trust.","Только если это правда. Честная реклама строит доверие."],["😊","Mia","I will write: handmade, 30 coins.","Я напишу: ручная работа, 30 монет."]],k:[["advertise","рекламировать"],["poster","плакат"],["handmade","ручной работы"]],q:[["What goes on the poster?",["A photo and a price","A secret","Nothing"],0],["When can you write 'the best'?",["Only if it is true","Always","Never write anything"],0],["What will Mia write?",["Handmade, 30 coins","Free for all","Best in the world"],0]]},
{id:"st40",v:8,t:"Competitors",r:60,p:[["🏪🏪","Max","Another kid sells bracelets cheaper!","Другой ребёнок продаёт браслеты дешевле!"],["😟","Mia","What should I do?","Что мне делать?"],["🔍","Leo","Compare: quality, price, service.","Сравни: качество, цену, обслуживание."],["💎","Mia","Mine are stronger and have names on them.","Мои прочнее и с именами."],["💪","Leo","Competition pushes you to improve, not to give up.","Конкуренция подталкивает улучшаться, а не сдаваться."]],k:[["competitor","конкурент"],["quality","качество"],["improve","улучшать"]],q:[["What is the problem?",["A cheaper competitor","No beads","No friends"],0],["What should Mia compare?",["Quality, price, service","Only colours","Only shoes"],0],["Competition pushes you to…",["improve","give up","hide"],0]]},
{id:"st41",v:9,t:"The Family Budget",r:65,p:[["🏠💶","Leo","Our family earns money and spends it every month.","Наша семья каждый месяц зарабатывает и тратит деньги."],["📝","Mia","So we need a plan, like my own budget, but bigger!","Значит, нужен план, как мой бюджет, только больше!"],["🧮","Leo","First list the income. Then list all the expenses.","Сначала запиши доходы. Потом все расходы."],["⚖️","Max","If expenses are bigger than income, we have a problem.","Если расходов больше, чем доходов, это проблема."],["✅","Leo","Right. A good budget leaves money for saving.","Верно. Хороший бюджет оставляет деньги на накопления."]],k:[["income","доход"],["expenses","расходы"],["budget","бюджет"]],q:[["What do you list first in a budget?",["The income","The toys","The weather"],0],["When is there a problem?",["Expenses are bigger than income","Income is bigger","Never"],0],["A good budget leaves money for…",["saving","nothing","games only"],0]]},
{id:"st42",v:9,t:"Bills Every Month",r:65,p:[["🧾","Mia","Why does Mom pay for electricity every month?","Почему мама каждый месяц платит за электричество?"],["💡","Leo","We use lights, the fridge and the internet every day.","Мы каждый день пользуемся светом, холодильником и интернетом."],["🏠","Leo","Rent, water and heating are bills too. They come every month.","Аренда, вода и отопление тоже счета. Они приходят каждый месяц."],["📌","Max","So that money is spent before we buy anything fun.","Значит, эти деньги уходят раньше, чем мы купим что-то интересное."],["🔌","Mia","I will switch off lights to help the family save!","Я буду выключать свет, чтобы помочь семье экономить!"]],k:[["bill","счёт"],["rent","аренда"],["electricity","электричество"]],q:[["How often do bills come?",["Every month","Once in ten years","Never"],0],["What is a bill?",["Money to pay for a service","A free gift","A toy"],0],["How can Mia help?",["Switch off lights","Leave lights on","Buy more lamps"],0]]},
{id:"st43",v:9,t:"The Emergency Fund",r:65,p:[["🚗💥","Max","Oh no! The car broke. The repair costs 400 coins.","Ой! Машина сломалась. Ремонт стоит 400 монет."],["😟","Mia","Do we have money for that?","У нас есть на это деньги?"],["🛟","Leo","Yes. We keep an emergency fund for surprises like this.","Да. Мы держим запас на случай таких сюрпризов."],["🐷","Leo","It is money we do not touch for normal shopping.","Это деньги, которые мы не тратим на обычные покупки."],["💡","Max","I will keep a small emergency fund too!","Я тоже буду держать маленький запас!"]],k:[["emergency","чрезвычайная ситуация"],["fund","запас, фонд"],["repair","ремонт"]],q:[["What broke?",["The car","The TV","A cup"],0],["What is an emergency fund?",["Money saved for surprises","Money for sweets","A bank card"],0],["Do we use it for normal shopping?",["No","Yes, every day","Only for toys"],0]]},
{id:"st44",v:9,t:"Subscriptions Add Up",r:65,p:[["📺","Max","A cartoon app costs only 5 coins a month!","Приложение с мультиками стоит всего 5 монет в месяц!"],["🎵🎮","Mia","Music is 5, games are 8, books are 4…","Музыка 5, игры 8, книги 4…"],["🧮","Leo","Let's add them: 22 coins every month. 264 a year!","Давай сложим: 22 монеты в месяц. 264 в год!"],["😮","Max","Small payments become big money!","Маленькие платежи превращаются в большие деньги!"],["✂️","Leo","Keep only what you really use.","Оставь только то, чем правда пользуешься."]],k:[["subscription","подписка"],["monthly","ежемесячный"],["add up","складываться"]],q:[["How much do all the subscriptions cost per month?",["22 coins","5 coins","264 coins"],0],["How much is that per year?",["264 coins","22 coins","100 coins"],0],["What should you keep?",["Only what you really use","Everything","Nothing ever"],0]]},
{id:"st45",v:9,t:"Planning a Holiday",r:65,p:[["🏖️","Mia","Let's go to the sea next summer!","Давайте летом поедем на море!"],["💶","Leo","The trip costs 1200 coins. We have 10 months.","Поездка стоит 1200 монет. У нас 10 месяцев."],["🧮","Max","1200 ÷ 10 = 120 coins every month.","1200 ÷ 10 = 120 монет в месяц."],["📅","Leo","We put 120 into the holiday fund each month.","Каждый месяц кладём 120 в фонд отпуска."],["😎","Mia","Planning turns a dream into a real trip!","Планирование превращает мечту в настоящую поездку!"]],k:[["holiday","отпуск"],["trip","поездка"],["dream","мечта"]],q:[["How much does the trip cost?",["1200 coins","120 coins","10 coins"],0],["How much to save each month?",["120 coins","1200 coins","12 coins"],0],["What turns a dream into a trip?",["Planning","Luck","Waiting without saving"],0]]},
{id:"st46",v:10,t:"Money in the Phone",r:70,p:[["📱💳","Max","Dad pays with his phone. Is that real money?","Папа платит телефоном. Это настоящие деньги?"],["🏦","Leo","Yes! The phone is linked to his bank account.","Да! Телефон связан с его банковским счётом."],["👀","Mia","But you don't see coins leave the pocket.","Но не видно, как монеты уходят из кармана."],["⚠️","Leo","That is why digital money is easy to overspend.","Поэтому цифровые деньги легко потратить лишнего."],["📊","Max","I will check my balance after every payment.","Я буду проверять баланс после каждой оплаты."]],k:[["digital","цифровой"],["account","счёт"],["overspend","потратить лишнее"]],q:[["Is phone money real?",["Yes, it comes from a bank account","No, it is a game","Only on Sundays"],0],["Why is digital money easy to overspend?",["You don't see it leave","It is free","It grows by itself"],0],["What will Max do?",["Check his balance","Hide his phone","Pay faster"],0]]},
{id:"st47",v:10,t:"In-Game Purchases",r:70,p:[["🎮💎","Max","The game sells 100 gems for just 2 euros!","Игра продаёт 100 кристаллов всего за 2 евро!"],["🤔","Mia","Gems are not real. But the 2 euros are.","Кристаллы ненастоящие. А 2 евро — настоящие."],["🔁","Leo","Games make buying easy so you buy again and again.","Игры делают покупки лёгкими, чтобы ты покупал снова и снова."],["🧮","Max","Ten times 2 euros is 20 euros. That is a real book!","Десять раз по 2 евро — это 20 евро. Это настоящая книга!"],["✋","Leo","Always ask a parent before buying anything in a game.","Всегда спрашивай родителей перед покупкой в игре."]],k:[["gem","кристалл"],["in-game","внутриигровой"],["again","снова"]],q:[["Are gems real money?",["No, but you pay real money","Yes, you can eat them","They are free"],0],["Why do games make buying easy?",["So you buy again and again","To help you save","By accident"],0],["What should you do before buying?",["Ask a parent","Buy quickly","Use a friend's card"],0]]},
{id:"st48",v:10,t:"Safe Online Shopping",r:70,p:[["🛒💻","Mia","I found sneakers online for half the price!","Я нашла кроссовки в интернете за полцены!"],["🔍","Leo","Check the shop first. Is it known? Are there reviews?","Сначала проверь магазин. Он известный? Есть отзывы?"],["🔒","Leo","Pay only on safe sites, and only with a parent.","Плати только на надёжных сайтах и только с родителями."],["🚩","Max","The site has no address and only one photo…","У сайта нет адреса и всего одно фото…"],["🙅","Mia","Too good to be true. I will not buy there.","Слишком хорошо, чтобы быть правдой. Я там не куплю."]],k:[["online","в интернете"],["review","отзыв"],["safe","надёжный"]],q:[["What should you check first?",["The shop and its reviews","The colour of the site","Nothing"],0],["Who should help you pay?",["A parent","A stranger","Nobody"],0],["A very cheap offer can be…",["too good to be true","always great","free money"],0]]},
{id:"st49",v:10,t:"The Free Trial Trap",r:70,p:[["🎁","Max","A music app is free for 30 days!","Музыкальное приложение бесплатно 30 дней!"],["📄","Leo","Read the small text. After 30 days it costs 10 a month.","Прочитай мелкий текст. Через 30 дней — 10 в месяц."],["😬","Mia","Many people forget to cancel and pay for months.","Многие забывают отменить и платят месяцами."],["⏰","Leo","Set a reminder before the trial ends.","Поставь напоминание до конца пробного периода."],["✅","Max","Free is fine, but only if I remember to cancel!","Бесплатно — хорошо, но только если не забыть отменить!"]],k:[["trial","пробный период"],["cancel","отменить"],["reminder","напоминание"]],q:[["How long is the free trial?",["30 days","One year","Forever"],0],["What happens after the trial?",["It starts to cost money","It stays free","It disappears"],0],["How can you avoid paying?",["Set a reminder and cancel","Forget about it","Delete your email"],0]]},
{id:"st50",v:10,t:"Password Power",r:70,p:[["🔑","Mia","My password is 12345. Easy to remember!","Мой пароль 12345. Легко запомнить!"],["😱","Leo","And easy to guess! Use long passwords with words and numbers.","И легко угадать! Используй длинные пароли со словами и цифрами."],["🤫","Max","Can I tell my best friend my password?","Можно сказать пароль лучшему другу?"],["🚫","Leo","No. Passwords are like toothbrushes: only for you.","Нет. Пароль как зубная щётка: только для тебя."],["🛡️","Mia","A strong password protects my money and games!","Сильный пароль защищает мои деньги и игры!"]],k:[["password","пароль"],["guess","угадать"],["strong","сильный"]],q:[["Why is 12345 a bad password?",["It is easy to guess","It is too long","It has letters"],0],["Who can know your password?",["Only you (and parents)","Your best friend","Everyone"],0],["Passwords are like…",["toothbrushes","sweets","postcards"],0]]},
{id:"st51",v:11,t:"Saving vs Investing",r:75,p:[["🐷","Leo","Saving means keeping money safe for later.","Копить — значит хранить деньги в безопасности на потом."],["🌱","Leo","Investing means using money to try to make more money.","Инвестировать — значит использовать деньги, чтобы попытаться заработать больше."],["⚖️","Mia","Saving is safe. Investing can grow more, but it has risk.","Копить безопасно. Инвестиции могут вырасти больше, но есть риск."],["🧠","Max","So first an emergency fund, then investing?","Значит, сначала запас, а потом инвестиции?"],["👍","Leo","Exactly. Never invest money you need soon.","Именно. Никогда не вкладывай деньги, которые скоро понадобятся."]],k:[["invest","инвестировать"],["risk","риск"],["safe","безопасный"]],q:[["What does saving mean?",["Keeping money safe for later","Spending fast","Giving away"],0],["What can investing do?",["Grow more, with risk","Never lose","Always double"],0],["Which money should you not invest?",["Money you need soon","Extra money","Old coins"],0]]},
{id:"st52",v:11,t:"Interest on Interest",r:75,p:[["🌰","Leo","You have 100 coins. They grow 10% a year.","У тебя 100 монет. Они растут на 10% в год."],["📈","Mia","After one year: 110.","Через год: 110."],["🧮","Leo","Next year 10% of 110 is 11. Now you have 121.","В следующем году 10% от 110 — это 11. Теперь 121."],["❄️","Max","It grows like a snowball!","Растёт как снежный ком!"],["⏳","Leo","This is compound interest. Time makes it stronger.","Это сложный процент. Время делает его сильнее."]],k:[["compound interest","сложный процент"],["snowball","снежный ком"],["grow","расти"]],q:[["How much after one year?",["110 coins","100 coins","121 coins"],0],["How much after two years?",["121 coins","120 coins","110 coins"],0],["What makes compound interest stronger?",["Time","Spending","Noise"],0]]},
{id:"st53",v:11,t:"Start Early",r:75,p:[["👧","Mia","I start saving 10 coins a week at age 10.","Я начинаю откладывать по 10 монет в неделю в 10 лет."],["👦","Max","I start the same at age 15.","Я начинаю так же в 15 лет."],["⏳","Leo","Mia saves five years longer, and her money grows longer too.","Мия копит на пять лет дольше, и её деньги дольше растут."],["📈","Max","So she will have much more, even with the same coins a week!","Значит, у неё будет гораздо больше, хотя монеты те же!"],["🚀","Leo","The best time to start is now.","Лучшее время начать — сейчас."]],k:[["early","рано"],["longer","дольше"],["start","начинать"]],q:[["Who started saving earlier?",["Mia","Max","Leo"],0],["Why will Mia have more?",["Her money grows longer","She is lucky","She spends less on nothing"],0],["When is the best time to start?",["Now","Never","When you are old"],0]]},
{id:"st54",v:11,t:"A Basket of Companies",r:75,p:[["🧺","Leo","A fund is like a basket with small parts of many companies.","Фонд — как корзина с маленькими частями многих компаний."],["🍕🚗📱","Mia","Pizza, cars, phones — all in one basket?","Пицца, машины, телефоны — всё в одной корзине?"],["⚖️","Leo","Yes. If one company falls, others can still grow.","Да. Если одна компания падает, другие могут расти."],["🛡️","Max","So a fund spreads the risk!","Значит, фонд распределяет риск!"],["⚠️","Leo","Right, but its value can still go down sometimes.","Верно, но его стоимость всё равно иногда падает."]],k:[["fund","фонд"],["company","компания"],["spread","распределять"]],q:[["What is a fund like?",["A basket of many companies","One pizza","A piggy bank"],0],["Why is a fund safer than one company?",["It spreads the risk","It never falls","It is free"],0],["Can a fund lose value?",["Yes, sometimes","Never","Only on Mondays"],0]]},
{id:"st55",v:11,t:"Ups and Downs",r:75,p:[["🎢","Max","My grandpa's investment fell 10% this month!","Вложения дедушки упали на 10% за месяц!"],["😨","Mia","Should he sell everything now?","Ему всё продать прямо сейчас?"],["🧘","Leo","Markets go up and down. Panic selling locks in the loss.","Рынки растут и падают. Продажа в панике закрепляет убыток."],["📈","Leo","Over many years, good funds usually grew again.","За много лет хорошие фонды обычно снова росли."],["🙂","Max","So patience is a superpower for investors!","Значит, терпение — суперсила инвестора!"]],k:[["market","рынок"],["panic","паника"],["loss","убыток"]],q:[["What happened to the investment?",["It fell 10%","It doubled","Nothing"],0],["What does panic selling do?",["Locks in the loss","Makes money","Stops time"],0],["What is a superpower for investors?",["Patience","Panic","Luck"],0]]},
{id:"st56",v:12,t:"Choosing a Charity",r:80,p:[["🐶🏠","Mia","I want to give my Give coins to help animals.","Я хочу отдать монеты из «Дарить», чтобы помочь животным."],["🔍","Leo","Good! Check that the charity is real and known.","Хорошо! Проверь, что фонд настоящий и известный."],["📋","Max","Their website shows what they did with donations.","На их сайте видно, на что пошли пожертвования."],["🤝","Leo","Good charities are open about how they spend money.","Хорошие фонды открыто показывают, как тратят деньги."],["💛","Mia","Now I know my coins really help!","Теперь я знаю, что мои монеты правда помогают!"]],k:[["charity","благотворительный фонд"],["donation","пожертвование"],["open","открытый"]],q:[["Who does Mia want to help?",["Animals","A shop","Herself"],0],["What should you check first?",["That the charity is real","Its colours","Nothing"],0],["Good charities are…",["open about spending","secret","very loud"],0]]},
{id:"st57",v:12,t:"Time Is a Gift Too",r:80,p:[["⏰","Max","I have no coins left to give this month.","У меня в этом месяце не осталось монет на подарки."],["🧹","Leo","You can give time: help a neighbour or clean a park.","Можно подарить время: помочь соседу или убрать парк."],["👵","Mia","We carried shopping bags for old Mrs. Rose.","Мы донесли сумки пожилой миссис Роуз."],["😊","Max","She was so happy. And it cost nothing!","Она так обрадовалась. И это ничего не стоило!"],["💡","Leo","Kindness is valuable, even without money.","Доброта ценна даже без денег."]],k:[["neighbour","сосед"],["kindness","доброта"],["volunteer","волонтёр"]],q:[["What can you give without money?",["Your time","Nothing","Only coins"],0],["Who did they help?",["Mrs. Rose","A shop","A bank"],0],["Kindness is…",["valuable","useless","expensive"],0]]},
{id:"st58",v:12,t:"Lending to a Friend",r:80,p:[["🙏","Max","My friend asks to borrow 50 coins.","Друг просит одолжить 50 монет."],["🤔","Leo","Ask yourself: can I live without this money if he forgets?","Спроси себя: смогу ли я без этих денег, если он забудет?"],["📅","Mia","Agree on a date to pay back.","Договоритесь о дате возврата."],["🤝","Max","He paid back on time. Now I trust him more.","Он вернул вовремя. Теперь я доверяю ему больше."],["💡","Leo","Lend only what you can afford, and be clear about it.","Одалживай только то, что можешь себе позволить, и договаривайся чётко."]],k:[["lend","одалживать"],["trust","доверие"],["afford","позволить себе"]],q:[["How much did the friend ask for?",["50 coins","500 coins","5 coins"],0],["What should you agree on?",["A date to pay back","Nothing","A secret"],0],["What should you lend?",["Only what you can afford","All your savings","Your parents' money"],0]]},
